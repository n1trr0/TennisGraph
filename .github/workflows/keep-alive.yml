name: Keep Alive Job

on:
  schedule:
    # Ejecutar todos los días a las 8:00 AM UTC
    - cron: '0 8 * * *'
  workflow_dispatch: # Permite ejecutar manualmente el workflow

jobs:
  keep-alive:
    runs-on: ubuntu-latest
    
    steps:
      - name: Hacer petición HTTP para mantener la app activa
        run: |
          echo "Haciendo petición a TennisGraph..."
          http_code=$(curl -L -s -o /dev/null -w "%{http_code}" --connect-timeout 10 --max-time 30 https://tennisgraph.n1tr0.deno.dev/players/f14ccb0f-74c7-4c87-88a1-b03544378d52/trophies)
          exit_code=$?
          
          echo "Código de respuesta HTTP: $http_code"
          echo "Exit code de curl: $exit_code"
          
          if [ $exit_code -eq 0 ]; then
            if [ "$http_code" = "200" ] || [ "$http_code" = "304" ]; then
              echo "✅ Petición exitosa - La app está activa"
              exit 0
            else
              echo "⚠️ Código de respuesta inesperado: $http_code"
              exit 0
            fi
          else
            echo "❌ Error al hacer la petición (curl exit code: $exit_code)"
            exit 0
          fi
      
      - name: Timestamp
        run: echo "Job ejecutado el $(date)"
